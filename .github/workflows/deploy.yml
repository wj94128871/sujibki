name: market-dashboard deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/worker/package-lock.json
            app/web/package-lock.json

      - name: worker test + typecheck
        working-directory: app/worker
        run: |
          npm ci
          # seed_projects.json은 .gitignore로 누락될 수 있어 CI에서 더미 생성 (프로덕션은 Neon 사용)
          if [ ! -f src/seed_projects.json ]; then echo '[]' > src/seed_projects.json; echo "created dummy seed_projects.json"; fi
          if [ ! -f src/seed_keywords.json ]; then echo '{"period":"2026-08","keywords":[]}' > src/seed_keywords.json; echo "created dummy seed_keywords.json"; fi
          npm run test
          npm run typecheck

      - name: web build (VITE_API=Worker URL)
        working-directory: app/web
        env:
          VITE_API: ${{ vars.WORKER_PUBLIC_URL }}
        run: |
          npm ci
          npm run build
          rm -rf dist/functions
          ls -la dist

      - name: deploy worker (wrangler)
        working-directory: app/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: deploy pages (wrangler pages)
        working-directory: app/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=market-dashboard --branch=main --commit-dirty=true
