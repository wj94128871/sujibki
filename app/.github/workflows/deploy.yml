name: market-dashboard build & deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: |
          worker/package-lock.json
          web/package-lock.json }
      - name: loader ETL tests
        run: |
          python -m pip install --upgrade pip
          cd loader && pip install -e . pytest && python -m pytest tests/ -q
      - name: worker test + typecheck
        run: |
          cd worker && npm ci && npm run test && npm run typecheck
      - name: web test + build
        run: |
          cd web && npm ci && npm run test && npm run typecheck && npm run build
      - name: deploy worker (wrangler)
        run: |
          cd worker && npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: deploy pages (wrangler pages)
        run: cd web && npx wrangler pages deploy dist --project-name=market-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
